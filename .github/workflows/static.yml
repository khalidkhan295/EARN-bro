button.full{width:100%;border:none;border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.3);transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px}
button.full:active{transform:scale(0.98)}
button:disabled{background:#cbd5e1!important;color:#64748b!important;box-shadow:none!important;cursor:not-allowed!important}

.adbox{min-height:170px;border:2px dashed #93c5fd;background:#eff6ff;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:16px 0;padding:20px;color:#1e3a8a}
.adbox-icon{width:50px;height:50px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:10px}
.adbox h3{font-size:15px;font-weight:700;color:#1e40af}
.adbox p{font-size:12px;color:#3b82f6;margin-top:3px}
.reward-tag{margin-top:8px;background:#dbeafe;color:#1d4ed8;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}

.refcode{background:#f1f5f9;border:2px dashed #cbd5e1;padding:15px;border-radius:14px;font-weight:800;letter-spacing:3px;font-size:22px;color:#334155;margin:14px 0;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #f1f5f9}
.row:last-child{border:0}
.btn-sm{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px;box-shadow:0 -3px 15px rgba(0,0,0,0.06);border-top:1px solid #e2e8f0;z-index:30}
.navbtn{background:none;border:none;color:#64748b;padding:6px 2px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:10px;transition:all 0.15s}
.navbtn.active{color:#2563eb;font-weight:700}
.navbtn svg{width:20px;height:20px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal-box{background:#fff;width:100%;max-width:480px;padding:24px;border-radius:28px 28px 0 0;box-shadow:0 -10px 25px rgba(0,0,0,0.15);animation:slideUp 0.25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-header h2{font-size:18px;font-weight:700;color:#0f172a}
.close-x{background:#f1f5f9;border:none;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#64748b}

label{font-size:12px;font-weight:700;color:#334155;display:block;margin-top:10px}
input,select{width:100%;padding:12px 14px;border:1.5px solid #cbd5e1;border-radius:12px;margin:6px 0 10px;font-size:14px;outline:none;font-weight:500}
input:focus,select:focus{border-color:#2563eb}
.btn-secondary{background:#f1f5f9!important;color:#475569!important;box-shadow:none!important;margin-top:8px}

#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:14px;display:none;z-index:90;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.25);max-width:90%;text-align:center}
