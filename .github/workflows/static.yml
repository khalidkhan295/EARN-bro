<!-- WITHDRAW MODAL -->
<div class="modal" id="withdrawModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>টাকা উত্তোলন (Withdraw)</h2>
      <button class="close-x" onclick="closeWithdraw()">✕</button>
