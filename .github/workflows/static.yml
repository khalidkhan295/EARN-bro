<div id="toast"></div>

<script>
const DAILY_LIMIT = 200;
const REWARD = 0.50; // প্রতি বিজ্ঞাপনে ৫০ পয়সা

let done = Number(localStorage.getItem("done")) || 0;
let balance = Number(localStorage.getItem("bal")) || 0;

function getLocalDate() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function dailyReset() {
  const today = getLocalDate();
  if (localStorage.getItem("adDate") !== today) {
    done = 0;
    localStorage.setItem("done", "0");
    localStorage.setItem("adDate", today);
  }
}

function update() {
  if (done > DAILY_LIMIT) done = DAILY_LIMIT;
  const left = Math.max(0, DAILY_LIMIT - done);

  document.getElementById("balance").textContent = balance.toFixed(2);
  document.getElementById("done").textContent = done;
  document.getElementById("left").textContent = left;
  document.getElementById("homeDone").textContent = done;
  document.getElementById("earnDone").textContent = done;
  document.getElementById("earnLeft").textContent = left;
  document.getElementById("earned").textContent = "৳" + balance.toFixed(2);
  document.getElementById("progress").style.width = (done / DAILY_LIMIT * 100) + "%";

  const btn = document.getElementById("watchBtn");
  if (btn) {
    btn.disabled = done >= DAILY_LIMIT;
    btn.textContent = done >= DAILY_LIMIT ? "আজকের ২০০টি Ad সম্পন্ন" : "▶ Ad দেখুন (show_11892992)";
  }

  localStorage.setItem("done", done);
  localStorage.setItem("bal", balance);
  showWithdrawPending();
}

function showSection(id, btn) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  const target = document.getElementById(id);
  if (target) target.classList.add("active");

  document.querySelectorAll(".navbtn").forEach(b => b.classList.remove("active"));
  if (btn) {
    btn.classList.add("active");
  } else {
    const map = { home: 0, earn: 1, refer: 2, profile: 3 };
    const idx = map[id];
    if (idx !== undefined) document.querySelectorAll(".navbtn")[idx]?.classList.add("active");
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Rewarded Popup SDK Call as requested by user
async function watchAd() {
  if (done >= DAILY_LIMIT) {
    toast("আজকের ২০০টি বিজ্ঞাপনের লিমিট শেষ।");
    return;
  }

  const btn = document.getElementById("watchBtn");
  btn.disabled = true;
  btn.textContent = "Rewarded Ad চালু হচ্ছে...";

  if (typeof window.show_11892992 === "function") {
    // Rewarded Popup
    window.show_11892992('pop').then(() => {
      // user watch ad till the end or close it in interstitial format
      done++;
      balance += REWARD;
      localStorage.setItem("done", done);
      localStorage.setItem("bal", balance);
      update();
      toast("🎉 Ad সম্পন্ন! ৳" + REWARD.toFixed(2) + " যোগ হয়েছে।");
    }).catch(e => {
      // user get error during playing ad
      console.error(e);
      toast("বিজ্ঞাপনটি সম্পূর্ণ দেখা হয়নি বা লোড ব্যর্থ হয়েছে।");
    }).finally(() => {
      update();
    });
  } else {
    // Fallback if adblocker or SDK is blocked
    setTimeout(() => {
      done++;
      balance += REWARD;
      localStorage.setItem("done", done);
      localStorage.setItem("bal", balance);
      update();
      toast("[সিমুলেশন] Ad সম্পন্ন! ৳" + REWARD.toFixed(2) + " ব্যালেন্সে যোগ হয়েছে।");
    }, 1500);
  }
}

function copyCode() {
  const code = document.getElementById("refCode").textContent.trim();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code)
      .then(() => toast("Referral Code কপি হয়েছে!"))
      .catch(() => fallbackCopy(code));
  } else {
    fallbackCopy(code);
  }
}

function fallbackCopy(text) {
  const x = document.createElement("textarea");
  x.value = text;
  document.body.appendChild(x);
  x.select();
  try {
    document.execCommand("copy");
    toast("Referral Code কপি হয়েছে!");
  } catch (e) {
    toast("Code: " + text);
  }
  document.body.removeChild(x);
}

function openWithdraw() {
  document.getElementById("withdrawModal").style.display = "flex";
}

function closeWithdraw() {
  document.getElementById("withdrawModal").style.display = "none";
}

function requestWithdraw() {
  const method = document.getElementById("method").value;
  const account = document.getElementById("account").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if (!method) return toast("মেথড নির্বাচন করুন।");
  if (!account || account.length < 11) return toast("সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন।");
  if (!amount || amount < 50) return toast("সর্বনিম্ন উত্তোলন ৫০ টাকা।");
  if (amount > balance) return toast("আপনার পর্যাপ্ত ব্যালেন্স নেই।");

  balance -= amount;
  localStorage.setItem("bal", balance);
  localStorage.setItem("withdrawStatus", "pending");
  localStorage.setItem("withdrawMethod", method);
  localStorage.setItem("withdrawAmount", amount);
  localStorage.setItem("withdrawAccount", account);

  closeWithdraw();
  update();
  toast("Withdraw Request সফলভাবে পাঠানো হয়েছে!");
}

function showWithdrawPending() {
  const status = localStorage.getItem("withdrawStatus");
  const box = document.getElementById("withdrawPending");
  const text = document.getElementById("pendingText");
  if (status === "pending" && box && text) {
    const method = localStorage.getItem("withdrawMethod");
    const amount = localStorage.getItem("withdrawAmount");
    const account = localStorage.getItem("withdrawAccount");
    box.style.display = "block";
    text.textContent = method + " • ৳" + Number(amount).toFixed(2) + " • " + account + " — আপনার অনুরোধটি পেন্ডিং আছে।";
  } else if (box) {
    box.style.display = "none";
  }
}

function toast(message) {
  const t = document.getElementById("toast");
  t.textContent = message;
  t.style.display = "block";
  setTimeout(() => {
    t.style.display = "none";
  }, 2800);
}

dailyReset();
update();
</script>
</body>
</html>
